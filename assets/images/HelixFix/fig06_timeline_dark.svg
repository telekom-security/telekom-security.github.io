<title id="t">HelixFix infrastructure: domain registrations by role and hosting provider, Sept–Oct 2026</title>
<desc id="d">Timeline of the 40 of 41 attacker domains registered via Spaceship, by registration time (UTC), in three lanes (loader, command, payload hosts), coloured by hosting provider: Vultr until 17 September, AWS AS14618 from 20 September, AWS AS16509 (us-east-2) on 15 October. Vertical lines join domains registered within two seconds. A table lists the domains registered from 12 October.</desc>
