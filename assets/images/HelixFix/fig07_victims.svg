<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="t d" style="font-synthesis:none">
<title id="t">HelixFix victims: compromised websites by hosting country and week of first sighting</title>
<desc id="d">Left: 2,005 compromised websites by hosting country; Germany 472, Russia 333, United States 229, France 223, Poland 82, Switzerland 46, United Kingdom 46, other 574 including 42 without country. Right: new sites per week of first urlscan sighting: 14–20 Sep 1499, 21–27 Sep 40, 28 Sep–4 Oct 179, 5–11 Oct 225, 12–14 Oct 62. The first week contains the start of the search window and a bulk scan on 16 September; the fourth a bulk scan on 7 October.</desc>
